name: Daily Retrieval and push to Public-files Repo

on:
  schedule:
    - cron: "0 1 * * *"  # everyday at 01:00
  workflow_dispatch:

concurrency:
  group: main-jobs
  cancel-in-progress: true
  
jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the scraper
        run: python _retrieve_topanalysts.py --mode full

      - name: Commit and push output
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add *_top_analysts.csv
          git add *_top_analysts.html
          git add *latest_top_analysts.csv
          git add *latest_top_analysts.html
          git commit -m "Daily update $(date)" || echo "Nothing to commit"
          git push origin HEAD:${{ github.ref }}
      
      - name: Push to public repo
        env:
          PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          # clone the public repo
          git clone https://x-access-token:${PUBLIC_REPO_TOKEN}@github.com/pockos56/Public-files.git public_repo

          # copy CSVs
          mkdir -p public_repo/from-Stocks
          cp *_top_analysts.csv *_top_analysts.html *latest_top_analysts.csv *latest_top_analysts.html public_repo/from-Stocks/ || echo "No files to copy"
          cd public_repo
          
          # commit & push
          git add from-Stocks/
          git commit -m "Daily update $(date +'%Y-%m-%d')" || echo "Nothing to commit"
          git push

